const seededRand = (seed) => {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) & 0xffffffff; return (s >>> 0) / 0xffffffff; };
};

const generateAttendance = () => {
  const att = {};
  STUDENTS_LIST.forEach((stu, si) => {
    att[stu.id] = {};
    SUBJECTS.forEach((sub, sj) => {
      const rng = seededRand(si * 100 + sj);
      const total = 28 + Math.floor(rng() * 18);
      const pct = 0.52 + rng() * 0.43;
      const present = Math.floor(total * pct);
      att[stu.id][sub.id] = { total, present, absent: total - present };
    });
  });
  return att;
};

const generateMarks = () => {
  const marks = {};
  STUDENTS_LIST.forEach((stu, si) => {
    marks[stu.id] = {};
    SUBJECTS.forEach((sub, sj) => {
      const rng = seededRand(si * 200 + sj + 999);
      marks[stu.id][sub.id] = {
        s1: 13 + Math.floor(rng() * 12),
        s2: 14 + Math.floor(rng() * 11),
      };
    });
  });
  return marks;
};

const Toast = ({ msg, type="success", onClose }) => {
  const bg = {success:"#059669",error:"#dc2626",info:"#4f46e5",warning:"#d97706"}[type]||"#4f46e5";
  useEffect(() => { const t=setTimeout(onClose,3500); return()=>clearTimeout(t); },[onClose]);

  );
};

const CirclePct = ({ pct, size=56 }) => {
  const r=(size/2)-5, circ=2*Math.PI*r, dash=(pct/100)*circ, col=attColor(pct);
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:"rotate(-90deg)"}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e7eb" strokeWidth={4}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth={4}
        strokeDasharray={`${dash} ${circ-dash}`} strokeLinecap="round"/>
    </svg>
  );
};

                  style={{background:d.bg,border:`1.5px solid ${d.border}`,borderRadius:12,
                    padding:"10px 14px",display:"flex",justifyContent:"space-between",alignItems:"center",
                    cursor:"pointer",transition:"transform 0.15s"}}
                  onMouseDown={e=>e.currentTarget.style.transform="scale(0.98)"}
                  onMouseUp={e=>e.currentTarget.style.transform="scale(1)"}>
                  <span style={{fontWeight:800,fontSize:13,color:d.txt}}>{d.label}</span>
                  <span style={{fontSize:11,color:"#6b7280",fontFamily:"monospace"}}>{d.id} / {d.pass}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>
      <div style={{color:"#6366f1",fontSize:11,marginTop:20,opacity:0.6}}>GHRCE © 2024 · BCE Section B</div>
    </div>
  );
};

const StudentHome = ({ user, db, setActiveTab }) => {
  const att = db.attendance[user.id]||{};
  let totP=0,totT=0;
  SUBJECTS.forEach(s=>{const a=att[s.id];if(a){totP+=a.present;totT+=a.total;}});
  const overall = totT>0?Math.round((totP/totT)*100):0;
  const lowAtt = SUBJECTS.filter(s=>getAttPct(att[s.id])<75);
  const myLeaves = db.leaveApplications.filter(a=>a.studentId===user.id);
  const pending = myLeaves.filter(l=>l.status==="pending").length;

  return (
    <div style={{padding:16,paddingBottom:8}}>
      {/* Overall Card */}
      <div style={{background:"linear-gradient(135deg,#4f46e5,#7c3aed)",borderRadius:20,padding:20,marginBottom:16,
        boxShadow:"0 8px 24px rgba(79,70,229,0.3)"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <div>
            <div style={{color:"#c7d2fe",fontSize:11,fontWeight:700,marginBottom:4}}>OVERALL ATTENDANCE</div>
            <div style={{color:"#fff",fontSize:48,fontWeight:900,lineHeight:1}}>{overall}%</div>
            <div style={{color:overall>=75?"#6ee7b7":"#fca5a5",fontSize:12,fontWeight:600,marginTop:6}}>
              {overall>=75?"✓ Eligible for exams":"⚠ Below required 75%"}
            </div>
          </div>
          <div style={{position:"relative",width:80,height:80}}>
            <CirclePct pct={overall} size={80}/>
            <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",
              justifyContent:"center",color:"#fff",fontSize:14,fontWeight:800}}>{overall}%</div>
          </div>
        </div>
        <div style={{display:"flex",gap:12,marginTop:16}}>
          {[["Classes Attended",totP],["Classes Missed",totT-totP],["Total Classes",totT]].map(([l,v])=>(
            <div key={l} style={{flex:1,background:"rgba(255,255,255,0.15)",borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
              <div style={{color:"#fff",fontSize:18,fontWeight:900}}>{v}</div>
              <div style={{color:"#c7d2fe",fontSize:9,fontWeight:600,marginTop:2,lineHeight:1.2}}>{l}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Low Attendance Warning */}
      {lowAtt.length>0 && (
        <Card style={{border:"1.5px solid #fecaca",background:"#fff7f7",marginBottom:16}}>
          <div style={{padding:"12px 16px"}}>
            <div style={{color:"#dc2626",fontWeight:800,fontSize:13,marginBottom:8}}>⚠ Low Attendance Alert</div>
            {lowAtt.map(s=>(
              <div key={s.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                padding:"6px 0",borderBottom:"1px solid #fee2e2"}}>
                <span style={{fontSize:12,color:"#374151",fontWeight:600}}>{s.short}</span>
                <span style={{fontSize:12,color:"#dc2626",fontWeight:800,
                  background:"#fee2e2",padding:"2px 10px",borderRadius:20}}>
                  {getAttPct(att[s.id])}%
                </span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* Quick Stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[
          {icon:"📄",label:"Leave Applications",val:myLeaves.length,color:"#4f46e5",bg:"#eef2ff",action:()=>setActiveTab("leave")},
          {icon:"🕐",label:"Pending Leaves",val:pending,color:"#f59e0b",bg:"#fef3c7",action:()=>setActiveTab("leave")},
        ].map(item=>(
          <button key={item.label} onClick={item.action} style={{background:item.bg,border:"none",borderRadius:16,padding:16,
            textAlign:"left",cursor:"pointer",boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
            <div style={{fontSize:24,marginBottom:6}}>{item.icon}</div>
            <div style={{fontSize:24,fontWeight:900,color:item.color}}>{item.val}</div>
            <div style={{fontSize:11,color:"#6b7280",fontWeight:600,marginTop:2}}>{item.label}</div>
          </button>
        ))}
      </div>

      {/* Subject Summary */}
      <SectionHead title="Subject-wise Attendance"/>
      <Card>
        <div style={{padding:"12px 16px"}}>
          {SUBJECTS.map((sub,i)=>{
            const a=att[sub.id]||{present:0,total:0,absent:0};
            const pct=getAttPct(a);
            const fac=FACULTY_LIST.find(f=>f.id===sub.facultyId);
            return (
              <div key={sub.id} style={{paddingBottom:i<SUBJECTS.length-1?14:0,
                marginBottom:i<SUBJECTS.length-1?14:0,
                borderBottom:i<SUBJECTS.length-1?"1px solid #f3f4f6":"none"}}>

                    padding:"3px 10px",borderRadius:20,whiteSpace:"nowrap"}}>{pct}%</div>

                  <span>P: {a.present}</span><span>A: {a.absent}</span><span>T: {a.total}</span>
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
};

// EditField MUST be defined outside StudentLeave at module level.
// If defined inside, React creates a NEW component type on every keystroke
// re-render, which unmounts+remounts the input and loses focus.
const EditField = ({value, onChange, placeholder, multiline=false, style={}}) => (
  multiline
  ? <textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      rows={3} style={{border:"none",borderBottom:"1.5px dashed #6366f1",background:"transparent",
        outline:"none",fontSize:13,color:"#1e40af",fontWeight:600,width:"100%",
        resize:"none",fontFamily:"inherit",...style}}/>
  : <input value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder}
      style={{border:"none",borderBottom:"1.5px dashed #6366f1",background:"transparent",
        outline:"none",fontSize:13,color:"#1e40af",fontWeight:600,
        minWidth:80,maxWidth:"100%",...style}}/>
);

const StudentLeave = ({ user, db, setDb, showToast }) => {
  const [view,setView]=useState("list"); // list | new
  const [form,setForm]=useState({
    dept:user.department, college:user.college,
    subject:"Application for Leave",
    name:user.name, year:user.year,
    startDate:"", endDate:"", reason:""
  });

  // Re-read myLeaves fresh each render so newly submitted leaves appear immediately
  const myLeaves = (db.leaveApplications || [])
    .filter(a=>a.studentId===user.id)
    .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

  const submit = () => {
    if(!form.startDate||!form.endDate||!form.reason.trim()){
      showToast("Please fill in all required fields","error"); return;
    }
    const appId=genAppId();
    const newApp={
      id:appId, studentId:user.id, studentName:user.name,
      rollNo:user.rollNo||user.id,
      department:form.dept, college:form.college, year:form.year,
      subject:form.subject, startDate:form.startDate,
      endDate:form.endDate, reason:form.reason,
      status:"pending", timestamp:new Date().toISOString(),
    };
    const hodNotif={id:"HN"+Date.now(),
      message:`📬 New leave request from ${user.name} (${user.rollNo||user.id}) · ${appId}`,
      timestamp:new Date().toISOString(), read:false, applicationId:appId};
    const stuNotif={id:"SN"+Date.now(),
      message:`📤 Your application ${appId} has been sent to HOD. Status: Pending`,
      timestamp:new Date().toISOString(), read:false};
    setDb(d=>({
      ...d,
      leaveApplications:[...d.leaveApplications, newApp],
      notifications:{
        ...d.notifications,
        HOD001:[...(d.notifications.HOD001||[]), hodNotif],
        [user.id]:[...(d.notifications[user.id]||[]), stuNotif],
      }
    }));
    showToast(`✅ Application ${appId} sent to HOD!`,"success");
    setView("list");
    setForm({dept:user.department,college:user.college,subject:"Application for Leave",name:user.name,year:user.year,startDate:"",endDate:"",reason:""});
  };

  if(view==="new") return (
    <div style={{padding:16,paddingBottom:24}}>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
        <button onClick={()=>setView("list")} style={{background:"#f3f4f6",border:"none",borderRadius:10,
          padding:"8px 14px",cursor:"pointer",fontSize:12,fontWeight:700,color:"#374151"}}>← Back</button>
        <div style={{fontWeight:800,fontSize:16,color:"#111827"}}>New Leave Application</div>
      </div>

      <Card>
        <div style={{padding:20}}>
          <div style={{fontFamily:"'Georgia',serif",lineHeight:1.8,fontSize:13,color:"#1f2937"}}>
            <div style={{textAlign:"right",marginBottom:16}}>
              <div style={{fontSize:11,color:"#6b7280"}}>Date: {new Date().toLocaleDateString("en-IN",{day:"numeric",month:"long",year:"numeric"})}</div>
            </div>

            <div style={{marginBottom:16}}>
              <div>To,</div>
              <div>The Head of Department (HOD)</div>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <EditField value={form.dept} onChange={v=>setForm(f=>({...f,dept:v}))} placeholder="Department Name"/>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <EditField value={form.college} onChange={v=>setForm(f=>({...f,college:v}))} placeholder="College Name" style={{width:"100%"}}/>
              </div>
            </div>

            <div style={{marginBottom:16}}>
              <div style={{display:"flex",alignItems:"center",gap:4,flexWrap:"wrap"}}>
                <strong>Subject:</strong>
                <EditField value={form.subject} onChange={v=>setForm(f=>({...f,subject:v}))} placeholder="Subject" style={{flex:1}}/>
              </div>
            </div>

            <div style={{marginBottom:12}}>Respected Madam,</div>

            <div style={{marginBottom:16}}>
              I am{" "}
              <EditField value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Your Name"/>,
              a student of{" "}
              <EditField value={form.year} onChange={v=>setForm(f=>({...f,year:v}))} placeholder="Year" style={{width:50}}/>
              {" "}year from the{" "}
              <EditField value={form.dept} onChange={v=>setForm(f=>({...f,dept:v}))} placeholder="Department"/>
              {" "}department. I would like to inform you that I will not be able to attend college from{" "}
              <input type="date" value={form.startDate} onChange={e=>setForm(f=>({...f,startDate:e.target.value}))}
                style={{border:"none",borderBottom:"1.5px dashed #6366f1",background:"transparent",
                  outline:"none",fontSize:13,color:"#1e40af",fontWeight:600,cursor:"pointer"}}/>
              {" "}to{" "}
              <input type="date" value={form.endDate} onChange={e=>setForm(f=>({...f,endDate:e.target.value}))}
                style={{border:"none",borderBottom:"1.5px dashed #6366f1",background:"transparent",
                  outline:"none",fontSize:13,color:"#1e40af",fontWeight:600,cursor:"pointer"}}/>
              {" "}due to{" "}
              <EditField value={form.reason} onChange={v=>setForm(f=>({...f,reason:v}))} placeholder="reason for leave"/>.
            </div>

            <div style={{marginBottom:16}}>
              Therefore, I kindly request you to grant me leave for the above-mentioned period.
              I assure you that I will complete all my pending work and assignments after returning.
            </div>

            <div style={{marginBottom:20}}>
              Thanking you.<br/><br/>
              Yours faithfully,<br/>
              <EditField value={form.name} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Your Name"/><br/>
              <span style={{fontSize:11,color:"#6b7280"}}>{user.rollNo||user.id}</span><br/>
              <EditField value={form.dept} onChange={v=>setForm(f=>({...f,dept:v}))} placeholder="Department"/>
            </div>
          </div>

          <div style={{borderTop:"1.5px dashed #e5e7eb",paddingTop:16}}>
            <div style={{fontSize:11,color:"#9ca3af",marginBottom:12,textAlign:"center"}}>
              💡 Fields with <span style={{color:"#6366f1",fontWeight:700}}>blue underline</span> are editable
            </div>
            <button onClick={submit} style={{width:"100%",background:"linear-gradient(135deg,#4f46e5,#7c3aed)",
              color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:14,fontWeight:800,cursor:"pointer",
              boxShadow:"0 4px 16px rgba(79,70,229,0.4)"}}>
              📤 Send to HOD
            </button>
          </div>
        </div>
      </Card>
    </div>
  );

  // Status counts for summary chips
  const pendingCount = myLeaves.filter(l=>l.status==="pending").length;
  const approvedCount = myLeaves.filter(l=>l.status==="approved").length;

  return (
    <div style={{padding:16,paddingBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontWeight:800,fontSize:16,color:"#111827"}}>My Leave Applications</div>
        <button onClick={()=>setView("new")} style={{background:"linear-gradient(135deg,#4f46e5,#7c3aed)",
          color:"#fff",border:"none",borderRadius:12,padding:"8px 16px",fontSize:12,fontWeight:800,cursor:"pointer"}}>
          + Apply
        </button>
      </div>

      {/* Summary bar */}
      {myLeaves.length>0 && (
        <div style={{display:"flex",gap:8,marginBottom:14}}>
          {[
            {l:"Total",v:myLeaves.length,bg:"#eef2ff",c:"#4f46e5"},
            {l:"Pending",v:pendingCount,bg:"#fef3c7",c:"#d97706"},
            {l:"Approved",v:approvedCount,bg:"#dcfce7",c:"#059669"},
          ].map(item=>(
            <div key={item.l} style={{flex:1,background:item.bg,borderRadius:12,padding:"10px 8px",textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:900,color:item.c}}>{item.v}</div>
              <div style={{fontSize:10,color:item.c,fontWeight:600,opacity:0.8}}>{item.l}</div>
            </div>
          ))}
        </div>
      )}

      {myLeaves.length===0
        ? <div style={{textAlign:"center",padding:"48px 20px",color:"#9ca3af"}}>
            <div style={{fontSize:48,marginBottom:12}}>📄</div>
            <div style={{fontWeight:700,fontSize:15}}>No leave applications yet</div>
            <div style={{fontSize:12,marginTop:6}}>Tap "+ Apply" to submit your first leave</div>
          </div>
        : myLeaves.map(app=>(
          <Card key={app.id} style={{border:app.status==="pending"?"1.5px solid #c7d2fe":"none"}}>
            <div style={{padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                <div>
                  <div style={{fontWeight:800,fontSize:13,color:"#111827"}}>{app.id}</div>
                  <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>{fmtDate(app.timestamp)} · {fmtTime(app.timestamp)}</div>
                </div>
                <span style={{background:statusBg(app.status),color:statusColor(app.status),
                  fontSize:11,fontWeight:800,padding:"4px 12px",borderRadius:20}}>
                  {statusLabel(app.status)}
                </span>
              </div>
              <div style={{fontSize:12,color:"#374151",marginBottom:4,fontWeight:600}}>
                📅 {fmtDate(app.startDate)} → {fmtDate(app.endDate)}
              </div>
              <div style={{fontSize:12,color:"#6b7280",marginBottom:8}}>📝 {app.reason}</div>
              <div style={{fontSize:11,color:"#9ca3af"}}>{app.department} · {app.college}</div>
            </div>
          </Card>
        ))
      }
    </div>
  );
};

// STUDENT — SESSIONAL MARKS
// ═══════════════════════════════════════════════════════════════════

const StudentMarks = ({ user, db }) => {
  const myMarks = db.sessionalMarks?.[user.id] || {};

  // Safe integer parse — handles both number and string values from faculty input
  const safeInt = (v) => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
  const markPct50 = (t) => Math.min(100, Math.round((t / 50) * 100)); // for total /50
  const markPct25 = (v) => Math.min(100, Math.round((v / 25) * 100)); // for each /25
  const markColor = (pct) => pct >= 80 ? "#059669" : pct >= 60 ? "#f59e0b" : "#ef4444";
  const markBg    = (pct) => pct >= 80 ? "#dcfce7" : pct >= 60 ? "#fef3c7" : "#fee2e2";

  // Compute summary averages
  let sumS1=0, sumS2=0, cnt=0;
  SUBJECTS.forEach(sub => {
    const m = myMarks[sub.id];
    if(m && m.s1 !== undefined){ sumS1 += safeInt(m.s1); sumS2 += safeInt(m.s2); cnt++; }
  });
  const avgS1 = cnt > 0 ? Math.round(sumS1 / cnt) : 0;
  const avgS2 = cnt > 0 ? Math.round(sumS2 / cnt) : 0;
  const avgTotal = avgS1 + avgS2;

  return (
    <div style={{padding:16,paddingBottom:8}}>
      <div style={{fontWeight:800,fontSize:16,color:"#111827",marginBottom:14}}>Sessional Marks</div>

      {/* Summary row — 3 cards: S1 avg, S2 avg, combined avg */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:16}}>
        {[
          {label:"S1 Avg",val:avgS1,max:25,bg:"#eef2ff",c:"#4f46e5"},
          {label:"S2 Avg",val:avgS2,max:25,bg:"#f0fdf4",c:"#059669"},
          {label:"Combined",val:avgTotal,max:50,bg:"#fdf4ff",c:"#7c3aed"},
        ].map(item=>(
          <div key={item.label} style={{background:item.bg,borderRadius:14,padding:"12px 8px",textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:900,color:item.c,lineHeight:1}}>{item.val}</div>
            <div style={{fontSize:9,color:item.c,opacity:0.7,fontWeight:700}}>/{item.max}</div>
            <div style={{fontSize:10,color:item.c,fontWeight:600,marginTop:4,opacity:0.8}}>{item.label}</div>
          </div>
        ))}
      </div>

      {/* Per subject marks */}
      {SUBJECTS.map(sub => {
        const m = myMarks[sub.id] || {};
        const fac = FACULTY_LIST.find(f=>f.id===sub.facultyId);
        const hasMarks = m.s1 !== undefined;
        const s1val = safeInt(m.s1);
        const s2val = safeInt(m.s2);
        const totalVal = s1val + s2val; // always = s1 + s2, guaranteed correct
        const s1pct = markPct25(s1val);
        const s2pct = markPct25(s2val);
        const totpct = markPct50(totalVal);
        return (
          <Card key={sub.id}>
            <div style={{padding:16}}>
              <div style={{marginBottom:12}}>
                <div style={{fontWeight:800,fontSize:13,color:"#111827"}}>{sub.name}</div>
                <div style={{fontSize:11,color:"#9ca3af"}}>{sub.code} · {fac?.name}</div>
              </div>
              {hasMarks ? (
                <>
                  {/* Three boxes: S1 | S2 | Total — values are clearly labeled */}
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:10}}>
                    {[
                      {label:"Sessional 1",val:s1val,max:25,pct:s1pct},
                      {label:"Sessional 2",val:s2val,max:25,pct:s2pct},
                      {label:"Total",val:totalVal,max:50,pct:totpct},
                    ].map(item=>(
                      <div key={item.label} style={{
                        background:markBg(item.pct),borderRadius:12,
                        padding:"10px 6px",textAlign:"center",
                        border:`1.5px solid ${markColor(item.pct)}30`}}>
                        <div style={{fontSize:24,fontWeight:900,color:markColor(item.pct),lineHeight:1}}>{item.val}</div>
                        <div style={{fontSize:9,color:markColor(item.pct),fontWeight:700,opacity:0.7}}>/{item.max}</div>
                        <div style={{fontSize:9,color:"#6b7280",fontWeight:600,marginTop:3,lineHeight:1.2}}>{item.label}</div>
                      </div>
                    ))}
                  </div>
                  {/* Equation line: S1 + S2 = Total — makes it crystal clear */}
                  <div style={{background:"#f8fafc",borderRadius:8,padding:"6px 12px",
                    textAlign:"center",fontSize:12,color:"#374151",fontWeight:700,marginBottom:8}}>
                    {s1val} + {s2val} = <span style={{color:markColor(totpct),fontWeight:900}}>{totalVal}</span> / 50
                  </div>
                  {/* Progress bar for total */}
                  <div style={{height:8,background:"#f3f4f6",borderRadius:4,overflow:"hidden"}}>
                    <div style={{height:"100%",width:totpct+"%",
                      background:markColor(totpct),borderRadius:4,transition:"width 0.5s"}}/>
                  </div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#9ca3af",marginTop:4}}>
                    <span>{totpct}% scored</span>
                    <span>{50-totalVal} marks to full marks</span>
                  </div>
                </>
              ) : (
                <div style={{textAlign:"center",padding:"12px",background:"#f9fafb",borderRadius:12}}>
                  <span style={{fontSize:12,color:"#9ca3af"}}>Marks not entered yet by faculty</span>
                </div>
              )}
            </div>
          </Card>
        );
      })}
    </div>
  );
};

const FacultyAttendance = ({ user, db, setDb, showToast }) => {
  const mySubs=SUBJECTS.filter(s=>user.subjects?.includes(s.id));
  const [selSub,setSelSub]=useState(mySubs[0]?.id||"");
  const [present,setPresent]=useState({});
  const [search,setSearch]=useState("");
  const [saved,setSaved]=useState(false);

  const filtered=STUDENTS_LIST.filter(s=>
    s.name.toLowerCase().includes(search.toLowerCase())||s.rollNo.includes(search));

  const toggle=(id)=>setPresent(p=>({...p,[id]:!p[id]}));
  const setAll=(v)=>{const np={};STUDENTS_LIST.forEach(s=>np[s.id]=v);setPresent(np);};

  const save=()=>{
    if(!selSub){showToast("Select a subject","error");return;}
    setDb(d=>{
      const newAtt={...d.attendance};
      STUDENTS_LIST.forEach(s=>{
        if(!newAtt[s.id]) newAtt[s.id]={};
        const cur=newAtt[s.id][selSub]||{present:0,total:0,absent:0};
        const isPresent=!!present[s.id];
        newAtt[s.id][selSub]={
          total:cur.total+1,
          present:cur.present+(isPresent?1:0),
          absent:cur.absent+(isPresent?0:1),
        };
      });
      return {...d,attendance:newAtt};
    });
    showToast("✅ Attendance saved successfully!","success");
    setSaved(true);
    setPresent({});
    setTimeout(()=>setSaved(false),2000);
  };

  const presentCount=STUDENTS_LIST.filter(s=>!!present[s.id]).length;

  return (
    <div style={{padding:16,paddingBottom:8}}>
      <div style={{fontWeight:800,fontSize:16,color:"#111827",marginBottom:14}}>Mark Attendance</div>

      {/* Subject selector */}
      <div style={{marginBottom:14}}>
        <div style={{fontSize:10,fontWeight:800,color:"#9ca3af",letterSpacing:1.5,marginBottom:8,textTransform:"uppercase"}}>Select Subject</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          {mySubs.map(s=>(
            <Chip key={s.id} label={s.short} active={selSub===s.id} onClick={()=>setSelSub(s.id)}/>
          ))}
        </div>
      </div>

      {/* Date and stats */}
      <Card style={{marginBottom:14}}>
        <div style={{padding:"12px 16px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:12,color:"#9ca3af",fontWeight:600}}>Date</div>
            <div style={{fontSize:14,fontWeight:800,color:"#111827"}}>{new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:12,color:"#9ca3af",fontWeight:600}}>Present / Total</div>
            <div style={{fontSize:18,fontWeight:900,color:"#059669"}}>{presentCount} / {STUDENTS_LIST.length}</div>
          </div>
        </div>
      </Card>

      {/* Controls */}
      <div style={{display:"flex",gap:8,marginBottom:14}}>
        <button onClick={()=>setAll(true)} style={{flex:1,background:"#dcfce7",border:"1.5px solid #bbf7d0",
          borderRadius:10,padding:"10px",fontSize:12,fontWeight:800,color:"#065f46",cursor:"pointer"}}>
          ✅ All Present
        </button>
        <button onClick={()=>setAll(false)} style={{flex:1,background:"#fee2e2",border:"1.5px solid #fecaca",
          borderRadius:10,padding:"10px",fontSize:12,fontWeight:800,color:"#991b1b",cursor:"pointer"}}>
          ❌ All Absent
        </button>
      </div>

      {/* Search */}
      <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search student name or roll no..."
        style={{width:"100%",border:"1.5px solid #e5e7eb",borderRadius:12,padding:"10px 14px",
          fontSize:13,color:"#111827",background:"#f8fafc",outline:"none",
          boxSizing:"border-box",marginBottom:12}}/>

      {/* Student List */}
      <Card>
        <div style={{maxHeight:360,overflowY:"auto"}}>
          {filtered.map((s,i)=>{
            const isP=!!present[s.id];
            return (
              <div key={s.id} onClick={()=>toggle(s.id)} style={{
                display:"flex",alignItems:"center",gap:12,padding:"10px 16px",
                background:isP?"#f0fdf4":"#fff",cursor:"pointer",
                borderBottom:i<filtered.length-1?"1px solid #f3f4f6":"none",
                transition:"background 0.15s"}}>
                <div style={{width:32,height:32,borderRadius:10,
                  background:isP?"#10b981":"#f3f4f6",display:"flex",alignItems:"center",
                  justifyContent:"center",fontSize:16,flexShrink:0}}>
                  {isP?"✅":"⬜"}
                </div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:13,color:"#111827"}}>{s.name}</div>
                  <div style={{fontSize:11,color:"#9ca3af"}}>{s.rollNo}</div>
                </div>
                <div style={{fontSize:11,fontWeight:800,
                  color:isP?"#059669":"#dc2626",
                  background:isP?"#dcfce7":"#fee2e2",
                  padding:"3px 10px",borderRadius:20}}>
                  {isP?"P":"A"}
                </div>
              </div>
            );
          })}
        </div>
      </Card>

      <button onClick={save} style={{width:"100%",background:"linear-gradient(135deg,#059669,#047857)",
        color:"#fff",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,
        cursor:"pointer",marginTop:12,boxShadow:"0 4px 16px rgba(5,150,105,0.35)"}}>
        💾 Save Attendance
      </button>
    </div>
  );
};

            return (
              <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",
                borderBottom:i<filtered.length-1?"1px solid #f3f4f6":"none"}}>
                <div style={{flex:2,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:12,color:"#111827",
                    overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</div>
                  <div style={{fontSize:10,color:"#9ca3af"}}>{s.rollNo}</div>
                </div>
                {[["s1",s1],["s2",s2]].map(([type,val])=>(
                  <input key={type} type="number" min={0} max={25} value={val}
                    onChange={e=>setVal(s.id,type,e.target.value)}
                    style={{width:56,textAlign:"center",border:"1.5px solid #e5e7eb",borderRadius:8,
                      padding:"6px 4px",fontSize:13,fontWeight:700,color:"#111827",
                      background:"#f8fafc",outline:"none"}}/>
                ))}
              </div>
            );
          })}
        </div>
      </Card>
      {Object.keys(edits).length>0 &&
        <button onClick={save} style={{width:"100%",background:"linear-gradient(135deg,#4f46e5,#7c3aed)",
          color:"#fff",border:"none",borderRadius:14,padding:"14px",fontSize:14,fontWeight:800,
          cursor:"pointer",marginTop:12,boxShadow:"0 4px 16px rgba(79,70,229,0.35)"}}>
          💾 Save Marks ({Object.keys(edits).length} students)
        </button>}
    </div>
  );
};

const FacultyUploads = ({ user, db, setDb, showToast }) => {
  const [modal,setModal]=useState(false);
  const [form,setForm]=useState({type:"syllabus",subjectId:"",name:""});
  const myUploads=db.uploads.filter(u=>u.uploadedBy===user.id);

  const fileRef = useRef(null);

  const upload=()=>{
    if(!form.name.trim()){showToast("Please enter a file name or select a file","error");return;}
    const size = form.fileSize || "—";
    const newUp={id:"UPL"+Date.now(),type:form.type,
      subjectId:form.subjectId||null,name:form.name,
      uploadedBy:user.id,date:new Date().toISOString().split("T")[0],size};
    setDb(d=>({...d,uploads:[...d.uploads,newUp]}));
    showToast("✅ "+form.name+" uploaded successfully!","success");
    setModal(false);
    setForm({type:"syllabus",subjectId:"",name:"",fileSize:""});
    if(fileRef.current) fileRef.current.value="";
  };

  const handleFileSelect=(e)=>{
    const file=e.target.files?.[0];
    if(file){
      const kb=file.size/1024;
      const sz=kb>1024?(kb/1024).toFixed(1)+" MB":Math.round(kb)+" KB";
      setForm(f=>({...f,name:file.name,fileSize:sz}));
    }
  };

  const typeIcon={"syllabus":"📖","practical":"🔬","timetable":"📅"};

  return (
    <div style={{padding:16,paddingBottom:8}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div style={{fontWeight:800,fontSize:16,color:"#111827"}}>Study Materials</div>
        <button onClick={()=>setModal(true)} style={{background:"linear-gradient(135deg,#059669,#047857)",
          color:"#fff",border:"none",borderRadius:12,padding:"8px 16px",fontSize:12,fontWeight:800,cursor:"pointer"}}>
          + Upload
        </button>
      </div>

      {db.uploads.map(u=>{
        const sub=SUBJECTS.find(s=>s.id===u.subjectId);
        const fac=FACULTY_LIST.find(f=>f.id===u.uploadedBy);
        const isMe=u.uploadedBy===user.id;
        return (
          <Card key={u.id} style={{border:isMe?"1.5px solid #bbf7d0":"none"}}>
            <div style={{padding:16,display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:44,height:44,borderRadius:12,
                background:isMe?"#dcfce7":"#eef2ff",
                display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,flexShrink:0}}>
                {typeIcon[u.type]||"📄"}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13,color:"#111827",
                  overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{u.name}</div>
                <div style={{fontSize:11,color:"#9ca3af",marginTop:2}}>
                  {sub?.code||"General"} · {u.size} · {fmtDate(u.date)}
                </div>
                <div style={{fontSize:11,color:isMe?"#059669":"#6b7280",fontWeight:isMe?700:400}}>
                  {isMe?"👤 You":fac?.name}
                </div>
              </div>
            </div>
          </Card>
        );
      })}

      {modal && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:100,
          display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
          <div style={{background:"#fff",borderRadius:"24px 24px 0 0",padding:24,width:"100%",maxWidth:440}}>
            <div style={{fontWeight:800,fontSize:16,color:"#111827",marginBottom:20}}>Upload Material</div>

            <div style={{fontSize:10,fontWeight:800,color:"#9ca3af",letterSpacing:1.5,marginBottom:8,textTransform:"uppercase"}}>Type</div>
            <div style={{display:"flex",gap:8,marginBottom:16}}>
              {["syllabus","practical","timetable"].map(t=>(
                <Chip key={t} label={t.charAt(0).toUpperCase()+t.slice(1)}
                  active={form.type===t} onClick={()=>setForm(f=>({...f,type:t}))}/>
              ))}
            </div>

            <div style={{fontSize:10,fontWeight:800,color:"#9ca3af",letterSpacing:1.5,marginBottom:8,textTransform:"uppercase"}}>Subject</div>
            <select value={form.subjectId} onChange={e=>setForm(f=>({...f,subjectId:e.target.value}))}
              style={{width:"100%",border:"1.5px solid #e5e7eb",borderRadius:12,padding:"12px 14px",
                fontSize:13,color:"#111827",background:"#f8fafc",marginBottom:16,boxSizing:"border-box"}}>
              <option value="">General (No specific subject)</option>
              {SUBJECTS.filter(s=>user.subjects?.includes(s.id)).map(s=>(
                <option key={s.id} value={s.id}>{s.code} — {s.name}</option>
              ))}
            </select>

            <div style={{fontSize:10,fontWeight:800,color:"#9ca3af",letterSpacing:1.5,marginBottom:8,textTransform:"uppercase"}}>Choose File</div>
            <div style={{border:"2px dashed #c7d2fe",borderRadius:12,padding:"16px",textAlign:"center",
              marginBottom:14,cursor:"pointer",background:"#f8faff"}}
              onClick={()=>fileRef.current&&fileRef.current.click()}>
              <div style={{fontSize:28,marginBottom:6}}>📎</div>
              <div style={{fontSize:13,fontWeight:700,color:"#4f46e5"}}>
                {form.name ? form.name : "Tap to select file"}
              </div>
              {form.fileSize && <div style={{fontSize:11,color:"#9ca3af",marginTop:4}}>{form.fileSize}</div>}
              <input ref={fileRef} type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt,.png,.jpg"
                style={{display:"none"}} onChange={handleFileSelect}/>
            </div>
            <div style={{fontSize:10,fontWeight:800,color:"#9ca3af",letterSpacing:1.5,marginBottom:8,textTransform:"uppercase"}}>Or Enter File Name Manually</div>
            <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
              placeholder="e.g. MAD301_Unit1_Notes.pdf"
              style={{width:"100%",border:"1.5px solid #e5e7eb",borderRadius:12,padding:"12px 14px",
                fontSize:13,color:"#111827",background:"#f8fafc",outline:"none",
                boxSizing:"border-box",marginBottom:20}}/>

            <div style={{display:"flex",gap:10}}>
              <button onClick={()=>setModal(false)} style={{flex:1,background:"#f3f4f6",border:"none",
                borderRadius:12,padding:"14px",fontSize:13,fontWeight:700,cursor:"pointer",color:"#374151"}}>
                Cancel
              </button>
              <button onClick={upload} style={{flex:2,background:"linear-gradient(135deg,#059669,#047857)",
                color:"#fff",border:"none",borderRadius:12,padding:"14px",fontSize:13,fontWeight:800,cursor:"pointer"}}>
                📤 Upload
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// HOD — LEAVE MANAGEMENT
// ═══════════════════════════════════════════════════════════════════

const HODLeave = ({ db, setDb, showToast }) => {
  const [filter,setFilter]=useState("all");
  const [expanded,setExpanded]=useState(null);

  const apps=db.leaveApplications.filter(a=>filter==="all"||a.status===filter)
    .sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));

  const updateStatus=(id,status)=>{
    const app=db.leaveApplications.find(a=>a.id===id);
    const labels={approved:"✅ Approved",rejected:"✕ Rejected",review_later:"⏰ Marked Review Later"};
    const msg=`${labels[status]} — ${app?.studentName}`;
    const stuNotif={id:"SN"+Date.now(),
      message:`${labels[status].split(" ")[0]} Your leave ${id} has been ${status==="review_later"?"marked for Review Later":status} by HOD`,
      timestamp:new Date().toISOString(), read:false};
    setDb(d=>({
      ...d,
      leaveApplications:d.leaveApplications.map(a=>a.id===id?{...a,status}:a),
      notifications:{...d.notifications,
        [app?.studentId]:[...(d.notifications[app?.studentId]||[]),stuNotif]},
    }));
    showToast(msg, status==="approved"?"success":status==="rejected"?"error":"warning");
  };

  const chips=[
    {id:"all",label:`All (${db.leaveApplications.length})`},
    {id:"pending",label:`Pending (${db.leaveApplications.filter(a=>a.status==="pending").length})`},
    {id:"approved",label:"Approved"},
    {id:"rejected",label:"Rejected"},
    {id:"review_later",label:"Review Later"},
  ];

  return (
    <div style={{padding:16,paddingBottom:8}}>
      <div style={{fontWeight:800,fontSize:16,color:"#111827",marginBottom:14}}>Leave Applications</div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}}>
        {chips.map(c=><Chip key={c.id} label={c.label} active={filter===c.id} onClick={()=>setFilter(c.id)}/>)}
      </div>

      {apps.length===0
        ? <div style={{textAlign:"center",padding:"40px 20px",color:"#9ca3af"}}>
            <div style={{fontSize:40,marginBottom:12}}>📄</div>
            <div style={{fontWeight:700}}>No applications found</div>
          </div>
        : apps.map(app=>(
          <Card key={app.id} style={{border:app.status==="pending"?"1.5px solid #bfdbfe":"none"}}>
            <div style={{padding:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <div>
                  <div style={{fontWeight:800,fontSize:14,color:"#111827"}}>{app.studentName}</div>
                  <div style={{fontSize:11,color:"#9ca3af"}}>{app.rollNo} · {app.id}</div>
                  <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{fmtDate(app.timestamp)}</div>
                </div>
                <span style={{background:statusBg(app.status),color:statusColor(app.status),
                  fontSize:11,fontWeight:800,padding:"4px 12px",borderRadius:20}}>
                  {statusLabel(app.status)}
                </span>
              </div>
              <div style={{fontSize:12,color:"#374151",marginBottom:4}}>
                📅 {fmtDate(app.startDate)} → {fmtDate(app.endDate)}
              </div>
              <div style={{fontSize:12,color:"#6b7280",marginBottom:10}}>Reason: {app.reason}</div>

              <button onClick={()=>setExpanded(expanded===app.id?null:app.id)}
                style={{width:"100%",background:"#f8fafc",border:"1px solid #e5e7eb",borderRadius:10,
                  padding:"8px",fontSize:12,fontWeight:700,color:"#4f46e5",cursor:"pointer",marginBottom:10}}>
                {expanded===app.id?"▲ Hide Letter":"▼ View Full Letter"}
              </button>

              {expanded===app.id && (
                <div style={{background:"#f8fafc",border:"1px solid #e5e7eb",borderRadius:12,padding:16,
                  marginBottom:10,fontFamily:"Georgia,serif",fontSize:12,lineHeight:1.9,color:"#1f2937"}}>
                  <p style={{textAlign:"right",fontSize:11,color:"#6b7280"}}>{fmtDate(app.timestamp)}</p>
                  <p>To,<br/>The Head of Department (HOD)<br/>{app.department}<br/>{app.college}</p>
                  <p><strong>Subject:</strong> Application for Leave</p>
                  <p>Respected Madam,</p>
                  <p>I am <strong>{app.studentName}</strong>, a student of <strong>{app.year}</strong> year from the <strong>{app.department}</strong> department. I would like to inform you that I will not be able to attend college from <strong>{fmtDate(app.startDate)}</strong> to <strong>{fmtDate(app.endDate)}</strong> due to <strong>{app.reason}</strong>.</p>
                  <p>Therefore, I kindly request you to grant me leave for the above-mentioned period. I assure you that I will complete all my pending work and assignments after returning.</p>
                  <p>Thanking you.</p>
                  <p>Yours faithfully,<br/><strong>{app.studentName}</strong><br/>{app.rollNo}<br/>{app.department}</p>
                </div>
              )}

              {app.status==="pending" && (
                <div style={{display:"flex",gap:8}}>
                  {[
                    {label:"✓ Approve",status:"approved",bg:"linear-gradient(135deg,#059669,#047857)",color:"#fff"},
                    {label:"⏰ Review Later",status:"review_later",bg:"linear-gradient(135deg,#f59e0b,#d97706)",color:"#fff"},
                    {label:"✕ Reject",status:"rejected",bg:"linear-gradient(135deg,#ef4444,#dc2626)",color:"#fff"},
                  ].map(btn=>(
                    <button key={btn.status} onClick={()=>updateStatus(app.id,btn.status)}
                      style={{flex:1,background:btn.bg,color:btn.color,border:"none",borderRadius:10,
                        padding:"10px 4px",fontSize:11,fontWeight:800,cursor:"pointer"}}>
                      {btn.label}
                    </button>
                  ))}
                </div>
              )}
            </div>
          </Card>
        ))
      }
    </div>
  );
};

// HOD — ANALYTICS
// ═══════════════════════════════════════════════════════════════════

const HODAnalytics = ({ db }) => {
  const [selTab,setSelTab]=useState("attendance");

  const getSubAtt = (subId) => {
    let t=0,c=0;
    STUDENTS_LIST.forEach(s=>{const a=db.attendance[s.id]?.[subId];if(a){t+=getAttPct(a);c++;}});
    return c>0?Math.round(t/c):0;
  };

  const getLowStudents = (subId) => STUDENTS_LIST.filter(s=>getAttPct(db.attendance[s.id]?.[subId])<75);

  const leaveStats={
    total:db.leaveApplications.length,
    pending:db.leaveApplications.filter(a=>a.status==="pending").length,
    approved:db.leaveApplications.filter(a=>a.status==="approved").length,
    rejected:db.leaveApplications.filter(a=>a.status==="rejected").length,
    review:db.leaveApplications.filter(a=>a.status==="review_later").length,
  };

  return (
    <div style={{padding:16,paddingBottom:8}}>
      <div style={{fontWeight:800,fontSize:16,color:"#111827",marginBottom:14}}>Analytics</div>
      <div style={{display:"flex",gap:8,marginBottom:16}}>
        {[["attendance","📊 Attendance"],["leaves","📄 Leaves"],["students","👩‍🎓 Students"]].map(([id,l])=>(
          <Chip key={id} label={l} active={selTab===id} onClick={()=>setSelTab(id)}/>
        ))}
      </div>

      {selTab==="attendance" && (
        <>
          <SectionHead title="Subject-wise Class Attendance"/>
          {SUBJECTS.map(sub=>{
            const avg=getSubAtt(sub.id);
            const low=getLowStudents(sub.id);
            const fac=FACULTY_LIST.find(f=>f.id===sub.facultyId);
            return (
              <Card key={sub.id}>
                <div style={{padding:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
                    <div>
                      <div style={{fontWeight:800,fontSize:13,color:"#111827"}}>{sub.name}</div>
                      <div style={{fontSize:11,color:"#9ca3af"}}>{sub.code} · {fac?.name}</div>
                    </div>
                    <div style={{background:attBg(avg),color:attColor(avg),fontSize:16,fontWeight:900,
                      padding:"4px 14px",borderRadius:14}}>Avg {avg}%</div>
                  </div>
                  <div style={{height:8,background:"#f3f4f6",borderRadius:4,overflow:"hidden",marginBottom:8}}>
                    <div style={{height:"100%",width:`${avg}%`,background:attColor(avg),borderRadius:4}}/>
                  </div>
                  <div style={{display:"flex",gap:8}}>
                    <div style={{flex:1,background:"#dcfce7",borderRadius:10,padding:8,textAlign:"center"}}>
                      <div style={{fontSize:18,fontWeight:900,color:"#065f46"}}>{STUDENTS_LIST.length-low.length}</div>
                      <div style={{fontSize:9,color:"#065f46",fontWeight:700}}>Above 75%</div>
                    </div>
                    <div style={{flex:1,background:"#fee2e2",borderRadius:10,padding:8,textAlign:"center"}}>
                      <div style={{fontSize:18,fontWeight:900,color:"#991b1b"}}>{low.length}</div>
                      <div style={{fontSize:9,color:"#991b1b",fontWeight:700}}>Below 75%</div>
                    </div>
                  </div>
                </div>
              </Card>
            );
          })}
        </>
      )}

      {selTab==="leaves" && (
        <>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
            {[
              {l:"Total",v:leaveStats.total,bg:"#eef2ff",c:"#4f46e5"},
              {l:"Pending",v:leaveStats.pending,bg:"#dbeafe",c:"#2563eb"},
              {l:"Approved",v:leaveStats.approved,bg:"#dcfce7",c:"#059669"},
              {l:"Rejected",v:leaveStats.rejected,bg:"#fee2e2",c:"#dc2626"},
            ].map(item=>(
              <div key={item.l} style={{background:item.bg,borderRadius:16,padding:16}}>
                <div style={{fontSize:28,fontWeight:900,color:item.c}}>{item.v}</div>
                <div style={{fontSize:11,color:item.c,fontWeight:600,opacity:0.8}}>{item.l}</div>
              </div>
            ))}
          </div>
          <SectionHead title="Recent Applications"/>
          {db.leaveApplications.slice().reverse().slice(0,5).map(app=>(
            <Card key={app.id}>
              <div style={{padding:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                  <div style={{fontWeight:700,fontSize:13,color:"#111827"}}>{app.studentName}</div>
                  <div style={{fontSize:11,color:"#9ca3af"}}>{app.rollNo} · {fmtDate(app.startDate)} → {fmtDate(app.endDate)}</div>
                </div>
                <span style={{background:statusBg(app.status),color:statusColor(app.status),
                  fontSize:11,fontWeight:800,padding:"4px 10px",borderRadius:20}}>
                  {statusLabel(app.status)}
                </span>
              </div>
            </Card>
          ))}
        </>
      )}

      {selTab==="students" && (
        <>
          <SectionHead title={`Section B — All ${STUDENTS_LIST.length} Students`}/>
          <Card>
            <div style={{maxHeight:500,overflowY:"auto"}}>
              {STUDENTS_LIST.map((s,i)=>{
                let tot=0,ttl=0;
                SUBJECTS.forEach(sub=>{const a=db.attendance[s.id]?.[sub.id];if(a){tot+=a.present;ttl+=a.total;}});
                const overall=ttl>0?Math.round((tot/ttl)*100):0;
                return (
                  <div key={s.id} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 16px",
                    borderBottom:i<STUDENTS_LIST.length-1?"1px solid #f3f4f6":"none",
                    background:overall<75?"#fff7f7":"#fff"}}>
                    <div style={{width:32,height:32,borderRadius:10,
                      background:overall>=75?"#dcfce7":"#fee2e2",
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:11,fontWeight:900,color:overall>=75?"#065f46":"#991b1b",flexShrink:0}}>
                      {overall}%
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:12,color:"#111827",
                        overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.name}</div>
                      <div style={{fontSize:10,color:"#9ca3af"}}>{s.rollNo}</div>
                    </div>
                    <div style={{fontSize:10,fontWeight:800,
                      color:overall>=75?"#059669":"#dc2626",
                      background:overall>=75?"#dcfce7":"#fee2e2",
                      padding:"3px 8px",borderRadius:20,whiteSpace:"nowrap"}}>
                      {overall>=75?"✓ OK":"⚠ Low"}
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        </>
      )}
    </div>
  );
};

                    <div key={u.id} style={{fontSize:11,color:"#374151",padding:"4px 0",

          </Card>
        );
      })}
    </div>
  );
};

// HOD — DASHBOARD HOME
// ═══════════════════════════════════════════════════════════════════

const HODHome = ({ db, setActiveTab }) => {
  const pending=db.leaveApplications.filter(a=>a.status==="pending");
  const reviewLater=db.leaveApplications.filter(a=>a.status==="review_later");
  const totalStudents=STUDENTS_LIST.length;
  let lowAttCount=0;
  STUDENTS_LIST.forEach(s=>{
    let tot=0,ttl=0;
    SUBJECTS.forEach(sub=>{const a=db.attendance[s.id]?.[sub.id];if(a){tot+=a.present;ttl+=a.total;}});
    if(ttl>0&&Math.round((tot/ttl)*100)<75) lowAttCount++;
  });

  return (
    <div style={{padding:16,paddingBottom:8}}>
      {pending.length>0 && (
        <div style={{background:"linear-gradient(135deg,#dc2626,#b91c1c)",borderRadius:16,padding:16,
          marginBottom:16,boxShadow:"0 4px 16px rgba(220,38,38,0.3)"}}>
          <div style={{color:"#fecaca",fontSize:11,fontWeight:700,marginBottom:4}}>🚨 ACTION REQUIRED</div>
          <div style={{color:"#fff",fontSize:18,fontWeight:900}}>{pending.length} Pending Leave Application{pending.length>1?"s":""}</div>
          <div style={{color:"#fca5a5",fontSize:12,marginTop:4}}>Tap to review and take action</div>
          <button onClick={()=>setActiveTab("leave")} style={{marginTop:10,background:"rgba(255,255,255,0.2)",
            border:"1px solid rgba(255,255,255,0.4)",color:"#fff",borderRadius:10,padding:"8px 16px",
            fontSize:12,fontWeight:700,cursor:"pointer"}}>
            Review Now →
          </button>
        </div>
      )}

      {reviewLater.length>0 && (
        <Card style={{border:"1.5px solid #fde68a",background:"#fffbeb",marginBottom:16}}>
          <div style={{padding:"12px 16px"}}>
            <div style={{color:"#92400e",fontWeight:800,fontSize:13}}>⏰ {reviewLater.length} marked Review Later</div>
            <div style={{color:"#a16207",fontSize:11,marginTop:4}}>Hourly reminder is active for these</div>
          </div>
        </Card>
      )}

      {/* Stats Grid */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
        {[
          {icon:"👩‍🎓",label:"Total Students",val:totalStudents,bg:"#eef2ff",c:"#4f46e5",action:()=>setActiveTab("analytics")},
          {icon:"⚠",label:"Low Attendance",val:lowAttCount,bg:"#fee2e2",c:"#dc2626",action:()=>setActiveTab("analytics")},
          {icon:"📄",label:"Pending Leaves",val:pending.length,bg:"#dbeafe",c:"#2563eb",action:()=>setActiveTab("leave")},
          {icon:"✅",label:"Approved Leaves",val:db.leaveApplications.filter(a=>a.status==="approved").length,bg:"#dcfce7",c:"#059669",action:()=>setActiveTab("leave")},
        ].map(item=>(
          <button key={item.label} onClick={item.action} style={{background:item.bg,border:"none",borderRadius:16,
            padding:16,textAlign:"left",cursor:"pointer"}}>
            <div style={{fontSize:24,marginBottom:6}}>{item.icon}</div>
            <div style={{fontSize:28,fontWeight:900,color:item.c}}>{item.val}</div>
            <div style={{fontSize:11,color:item.c,fontWeight:600,opacity:0.8}}>{item.label}</div>
          </button>
        ))}
      </div>

      {/* Faculty Overview */}
      <SectionHead title="Faculty Overview" action={
        <button onClick={()=>setActiveTab("faculty")} style={{background:"#eef2ff",border:"none",
          borderRadius:8,padding:"4px 10px",fontSize:11,fontWeight:700,color:"#4f46e5",cursor:"pointer"}}>
          View All
        </button>}/>
      {FACULTY_LIST.map(fac=>{
        const subs=SUBJECTS.filter(s=>fac.subjects.includes(s.id));
        return (
          <Card key={fac.id}>
            <div style={{padding:14,display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:40,height:40,borderRadius:12,
                background:"linear-gradient(135deg,#4f46e5,#7c3aed)",
                display:"flex",alignItems:"center",justifyContent:"center",
                color:"#fff",fontSize:13,fontWeight:900,flexShrink:0}}>
                {fac.name.split(" ").map(w=>w[0]).join("").slice(0,2)}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13,color:"#111827"}}>{fac.name}</div>
                <div style={{fontSize:11,color:"#9ca3af"}}>{fac.designation}</div>
              </div>
              <div style={{display:"flex",gap:4,flexWrap:"wrap",justifyContent:"flex-end"}}>
                {subs.map(s=>(
                  <span key={s.id} style={{background:"#dbeafe",color:"#1e40af",
                    fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:12}}>{s.short}</span>
                ))}
              </div>
            </div>
          </Card>
        );
      })}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════════════
// HOD DASHBOARD
// ═══════════════════════════════════════════════════════════════════

const HODDashboard = ({ user, db, setDb, onLogout }) => {
  const [tab,setTab]=useState("home");
  const [toast,setToast]=useState(null);
  const showToast=(msg,type="success")=>setToast({msg,type});

  // Hourly reminder for review_later items
  useEffect(()=>{
    const interval=setInterval(()=>{
      const rl=db.leaveApplications.filter(a=>a.status==="review_later");
      if(rl.length>0){
        showToast(`⏰ Reminder: ${rl.length} leave application${rl.length>1?"s":""} pending review!`,"warning");
        const newNotif={id:"HR"+Date.now(),
          message:`⏰ Reminder: ${rl.length} application${rl.length>1?"s":""} marked 'Review Later' need your attention`,
          timestamp:new Date().toISOString(), read:false};
        setDb(d=>({...d,notifications:{...d.notifications,
          HOD001:[...(d.notifications.HOD001||[]),newNotif]}}));
      }
    },30000); // 30 seconds in demo, 1 hour in prod
    return()=>clearInterval(interval);
  },[db.leaveApplications]);

  const unread=(db.notifications.HOD001||[]).filter(n=>!n.read).length;
  const pending=db.leaveApplications.filter(a=>a.status==="pending").length;

  const tabs=[
    {id:"home",icon:"🏠",label:"Home"},
    {id:"leave",icon:`📄${pending>0?` (${pending})`:""}`,label:"Leave"},
    {id:"analytics",icon:"📊",label:"Analytics"},
    {id:"faculty",icon:"👨‍🏫",label:"Faculty"},
    {id:"notifications",icon:"🔔",label:"Alerts"},
  ];

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      {toast && <Toast msg={toast.msg} type={toast.type} onClose={()=>setToast(null)}/>}
      <AppHeader title="🏛️ HOD Dashboard" sub={`${user.name} · Computer Engineering`}
        onLogout={onLogout} badge={unread} onNotif={()=>setTab("notifications")}/>
      <div style={{flex:1,overflowY:"auto"}}>
        {tab==="home"          && <HODHome db={db} setActiveTab={setTab}/>}
        {tab==="leave"         && <HODLeave db={db} setDb={setDb} showToast={showToast}/>}
        {tab==="analytics"     && <HODAnalytics db={db}/>}
        {tab==="faculty"       && <HODFacultyRecords db={db}/>}
        {tab==="notifications" && <NotificationsView userId="HOD001" db={db} setDb={setDb}/>}
      </div>
      <TabBar tabs={tabs} active={tab} setActive={setTab}/>
    </div>
  );
};

export default function App() {
  const [user,setUser]=useState(null);
  const [db,setDb]=useState(buildInitialState);

  const allUsers=[
    ...STUDENTS_LIST,
    ...FACULTY_LIST,
    {id:"HOD001",password:"hod123",role:"hod",name:"Prof. Sharayu Deote",
     department:"Computer Engineering",college:"Cummins College of Engineering for Women, Nagpur"},
  ];

  const onLogin=(id,pwd)=>{
    const u=allUsers.find(u=>u.id===id&&u.password===pwd);
    if(u){setUser(u);return{success:true};}
    return{success:false};
  };

  const onLogout=()=>setUser(null);

  if(!user) return <LoginScreen onLogin={onLogin}/>;

  return (
    <div style={{maxWidth:430,margin:"0 auto",height:"100vh",
      boxShadow:"0 0 60px rgba(0,0,0,0.15)",position:"relative",overflow:"hidden"}}>
      {user.role==="student" && <StudentDashboard user={user} db={db} setDb={setDb} onLogout={onLogout}/>}
      {user.role==="faculty" && <FacultyDashboard user={user} db={db} setDb={setDb} onLogout={onLogout}/>}
      {user.role==="hod"     && <HODDashboard     user={user} db={db} setDb={setDb} onLogout={onLogout}/>}
    </div>
  );
}


    // Mount the app
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
